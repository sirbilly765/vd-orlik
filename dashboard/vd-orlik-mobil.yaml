- type: custom:button-card
  entity: sensor.vd_orlik_data
  show_name: false
  show_icon: false
  show_state: false
  custom_fields:
    nadpis: '[[[ return ''24 HODIN''; ]]]'
    telo: '[[[ const a=states[''sensor.vd_orlik_data''].attributes; const f=v=> (v==null) ? null : Number(v).toFixed(1).replace(''.'','',''); function radek(l,v,c,znam){ const t = v==null ? ''<span style="opacity:.45;font-weight:500">—</span>'' : ((znam&&Number(v)>0?''+'':'''')+v); return ''<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0">''+''<span style="opacity:.72;font-size:.9em">''+l+''</span>''+''<span style="font-size:1.25em;font-weight:800;color:''+c+''">''+t+''</span></div>''; } const o=f(a.odtok_24h), p=f(a.pritok_24h), b=f(a.bilance_24h); let bc=''#94b3c4''; if(b!=null){ const n=Number(a.bilance_24h); bc = n>0.05?''#2dd4bf'':(n<-0.05?''#fb7185'':''#94b3c4''); } let pata=''mil. m³''; if(o==null||p==null||b==null){ const s=a.historie_nejstarsi; if(s){ const dnu=Math.floor((Date.now()-new Date(s).getTime())/86400000); pata = dnu<30 ? (''mil. m³ · zatím ''+dnu+'' dní historie'') : ''mil. m³ · řada zatím není souvislá''; } else { pata=''mil.
      m³ · sbírám data''; } } return radek(''Odteklo'',o,''#fb923c'',false)+radek(''Přiteklo'',p,''#38bdf8'',false)+radek(''Bilance'',b,bc,true)+''<div style="text-align:right;opacity:.4;font-size:.72em;margin-top:5px">''+pata+''</div>''; ]]]'
  styles:
    card:
    - background: '#111827'
    - border-radius: 18px
    - box-sizing: border-box
    - border: 1px solid rgba(255,255,255,0.06)
    - padding: 12px 16px
    grid:
    - display: grid
    - grid-template-areas: '"nadpis" "telo"'
    - row-gap: 4px
    - justify-items: stretch
    - align-content: center
    custom_fields:
      nadpis:
