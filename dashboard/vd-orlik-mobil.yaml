    orlik: '[[[ const ok = (function(){const b=states[''binary_sensor.vd_orlik_data_aktualni'']; return !!b && b.state===''on'';})(); return ''<div style="font-size:.85em;opacity:.6">''+''<span>data z Povodí Vltavy</span> ''+''<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px;background:''+(ok?''#4ade80'':''#f87171'')+''"></span>''+''</div>''; ]]]'
